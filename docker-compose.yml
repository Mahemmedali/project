# Lokal inkişaf: `docker compose up -d` → DATABASE_URI=postgres://gmb:gmb@localhost:5432/gmb
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gmb
      POSTGRES_PASSWORD: gmb
      POSTGRES_DB: gmb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
